name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: Lint
        run: uvx ruff check src tools

      - name: Test (Python)
        run: uv run pytest -q

      - name: Test (page)
        if: ${{ hashFiles('tests/js/**') != '' }}
        run: npm test
