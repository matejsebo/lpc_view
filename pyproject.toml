[project]
name = "lpc_view"
version = "0.1.0"
description = "View, inspect and fly through LAS/LAZ lidar point clouds"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "laspy[lazrs]>=2.7.0",
    "numpy>=2.5.4",
    "pyproj>=3.8.0",
    "pywebview>=6.2.1",
]

[project.scripts]
lpc_view = "lpc_view.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
